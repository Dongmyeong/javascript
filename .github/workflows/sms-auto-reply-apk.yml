name: SMS Auto Reply APK

on:
  push:
    paths:
      - "sms-auto-reply/**"
      - ".github/workflows/sms-auto-reply-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sms-auto-reply-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sms-auto-reply

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/SmsAutoReply-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk out/SmsAutoReply-latest.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsAutoReply-apk
          path: sms-auto-reply/out/*.apk
          retention-days: 30

      # Publish a rolling pre-release so the APK can be downloaded from a phone
      # browser without logging in or unzipping an Actions artifact.
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: sms-auto-reply-latest
        run: |
          gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "SMS Auto Reply (latest build)" \
            --notes "Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}

          폰에서 SmsAutoReply-latest.apk 를 내려받아 설치하세요. 자세한 설치 방법은 sms-auto-reply/README.md 참고." \
            out/SmsAutoReply-latest.apk "out/SmsAutoReply-${GITHUB_SHA::7}.apk"
